[package]
name = "gfs-ai-models"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
byteorder = "1"
gfs-domain = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

# GPU acceleration (optional, enabled by feature flag)
candle-core = { version = "0.8", optional = true, features = ["metal"] }
accelerate-src = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
# Enable GPU acceleration on macOS
metal = ["candle-core", "accelerate-src"]
