# PR workflow runs only after a repo admin approves the run.
# Configure: Settings → Environments → "pr-validation" → Required reviewers (e.g. admins or a team).
name: PR Build and Test

on:
  pull_request:
    branches:
      - main

# Cancel superseded runs when new commits land on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    environment: pr-validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt -- --check

      # The SQLite suites are cfg(unix), so this job is where the byte-copy
      # snapshot backend gets exercised — and it is the only place the snapshot
      # guard is load-bearing. On APFS, `cp -cRp` clones per file, so a snapshot
      # is largely crash-consistent by construction; `gfs_storage_file` copies
      # bytes, which is where an unquiesced snapshot tears.
      #
      # That coverage is a property of the runner image, not of the code, so it
      # can vanish silently. Assert it rather than assume it: on a
      # copy-on-write runner every test would still pass while covering
      # strictly less.
      - name: Assert the runner filesystem is not copy-on-write
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Ask whether a reflink WORKS, rather than matching filesystem names.
          # A name list gets this wrong: `stat` reports plain "xfs" whether or
          # not reflink=1 is set, and modern mkfs.xfs enables it by default — so
          # an XFS runner would pass a name check while quietly providing
          # copy-on-write and removing the coverage this step exists to protect.
          fs=$(stat -f --format=%T . || echo unknown)
          head -c 1M /dev/urandom > .cow-probe-src
          if cp --reflink=always .cow-probe-src .cow-probe-dst 2>/dev/null; then
            rm -f .cow-probe-src .cow-probe-dst
            echo "::error::runner filesystem ($fs) supports reflink, so 'cp --reflink=auto' clones instead of copying bytes. The byte-copy snapshot path — the only place the snapshot guard is load-bearing — is no longer exercised, and the tests cover strictly less than they appear to."
            exit 1
          fi
          rm -f .cow-probe-src .cow-probe-dst
          echo "runner filesystem: $fs — no reflink, byte-copy path exercised" 

      - name: Run tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --verbose

      - name: Run tests (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --verbose -- --skip clickhouse --skip postgres
