# Fast Training Configuration
#
# Use this configuration for:
# - Development and testing
# - Quick iterations
# - Exploring data structure
# - Hyperparameter search
#
# Training time: ~10-20 seconds per 10k rows
#
# Usage:
#   gfs train start --output models/dev_model --config examples/train_config_fast.toml

[model.w2v]
dimension = 64               # Smaller dimension = 2x faster
epochs = 5                   # Fewer epochs = 2x faster
learning_rate = 0.025
window = 5
negative_samples = 10        # Fewer samples = faster
min_count = 1
num_threads = 8              # Adjust to your CPU cores

[model.hnsw]
m = 8                        # Fewer connections = faster build
ef_construction = 100        # Lower precision = faster build
ef = 100                     # Lower precision = faster search

[model.walker]
num_walks = 5                # Fewer walks = faster
walk_length = 10             # Shorter walks = faster
seed = 42

# Data configuration
[data]
# Leave empty to include all tables, or specify specific ones:
# table_filter = ["products", "categories"]

row_limit = 5000             # Limit for fast testing (remove for all data)
include_relationships = true
split_ratios = [0.8, 0.1, 0.1]
split_seed = 42

# Training parameters
[training]
show_progress = true         # Show progress bar
compute_metrics = false      # Skip metrics = faster
metric_interval = 1

# Checkpointing (disabled for speed)
[checkpoint]
checkpoint_dir = ".gfs/checkpoints"
checkpoint_interval = 0      # 0 = disabled
max_checkpoints = 3

# Evaluation metrics (not computed when compute_metrics = false)
[evaluation]
metrics = ["Precision", "Recall"]
top_k_values = [5, 10]
